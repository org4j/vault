// Secrets from HashiCorp Vault (KV version 2) for any module, through Spring Vault: read only,
// failing closed, with Vault's own authentication methods (token, AppRole, Kubernetes) and token
// renewal from Spring Cloud Vault, a short cache for merchants' signing keys, and a client registry
// read while the app runs.
plugins {
    alias(libs.plugins.conventions.library)
    alias(libs.plugins.conventions.integration.test)
}

dependencies {
    api platform(libs.spring.boot.bom)
    api platform(libs.spring.cloud.bom)
    runtimeOnly libs.config4j // loads the files in META-INF/spring/…LibraryDefaults.imports
    api libs.error4j // VaultTransit's errors
    implementation libs.masking4j // PCI-DSS context and error log masking
    implementation libs.spring.cloud.starter.vault.config // services use VaultSecrets and VaultTransit, never Vault itself
    implementation libs.spring.boot.autoconfigure
    compileOnly libs.spring.boot.health // the health indicator, when the app has the actuator
    implementation libs.starter.validation // the properties are checked at startup

    testImplementation libs.spring.boot.health
    testImplementation testFixtures(libs.error4j)
    integrationTestImplementation libs.spring.boot.health
    integrationTestImplementation libs.testcontainers.core
    integrationTestImplementation libs.testcontainers.junit
    integrationTestImplementation libs.testcontainers.vault
}
