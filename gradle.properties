# The line this branch builds (1.x-SNAPSHOT, local builds only); a tag vX.Y.Z releases X.Y.Z.
version=1.x-SNAPSHOT

# This repository's own package: uz.khakimjanovich:vault4j. It was uz.khakimjanovich.platform:vault
# (GitHub lets only the repository a package is linked to publish it); the former coordinates are
# announced as a capability, so a build never loads both.
group=uz.khakimjanovich
formerCoordinates=uz.khakimjanovich.platform:vault

# The platform this library builds on (uz.khakimjanovich.settings), without -SNAPSHOT, and where to take it
# from: local (~/.m2), snapshot (develop's) or release (main's). CI sets PLATFORM_SOURCE.
platformVersion=1.0.0
platformSource=snapshot

org.gradle.caching=true
org.gradle.configuration-cache=true

# google-java-format (Spotless) reads javac internals; the Gradle daemon must export them.
org.gradle.jvmargs=-Xmx2g --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED
