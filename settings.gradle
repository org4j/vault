// One platform library in its own repository. platform.settings supplies the platform's
// repositories, its catalog (libs) and the build plugins; gradle.properties says which platform
// release to build on and where to take it from.
pluginManagement {
    repositories {
        maven {
            url = 'https://maven.pkg.github.com/khakimjanovich/*' // every repository's packages
            credentials {
                username = providers.gradleProperty('gpr.user').orElse(providers.environmentVariable('GH_PACKAGES_ACTOR')).getOrElse('')
                password = providers.gradleProperty('gpr.key').orElse(providers.environmentVariable('GH_PACKAGES_TOKEN')).getOrElse('')
            }
            content { includeGroupByRegex 'platform\\..*|uz\\.khakimjanovich(\\..+)?' }
        }
        gradlePluginPortal()
    }
}
plugins { id 'platform.settings' version '2.8.0-SNAPSHOT' }

rootProject.name = 'vault4j' // the artifact: uz.khakimjanovich:vault4j
